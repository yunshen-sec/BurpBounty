plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

dependencies {
    // `compile` was deprecated in Gradle 4.10 and removed in Gradle 7, which made the build fail
    // before it reached a single source file.
    implementation 'net.portswigger.burp.extender:burp-extender-api:1.7.13'
    implementation 'com.google.code.gson:gson:2.8.5'
}

java {
    // Burp loads extensions with its own JVM; keep the bytecode level it has always targeted.
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

sourceSets {
    main {
        // The sources live in main/java, not src/. The old `srcDir 'src'` pointed at a directory
        // that does not exist in this repository, so nothing was ever compiled from it.
        java {
            srcDirs = ['main/java']
        }
        resources {
            srcDirs = ['main/resources']
        }
    }
}

tasks.register('fatJar', Jar) {
    archiveBaseName = project.name + '-all'
    // Burp needs one self-contained jar: gson has to travel with the extension.
    from {
        configurations.runtimeClasspath
                .filter { it.name.startsWith('gson') }
                .collect { it.isDirectory() ? it : zipTree(it) }
    }
    // Several dependencies ship the same metadata entries; without this Gradle 7 fails the task.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    with jar
}
